app-id: io.github.AyAmbo.ComfyUIFlatpak
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: comfyui-flatpak

# Speed/size: do not generate separate debuginfo for huge binary Python wheels
# (PyTorch/CUDA/scipy/cryptography/etc.). This package is a local/shareable
# app bundle, not a distro debug-symbol build.
build-options:
  no-debuginfo: true

# Full NVIDIA + extension-enabled target.
# Network: localhost web UI, Manager registry/GitHub/model downloads, API nodes.
# device=all: NVIDIA CUDA compute may require /dev/nvidia*, nvidia-uvm, and nvidiactl.
finish-args:
  - --share=network
  - --device=all

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - /share/gtk-doc

modules:
  # Generated by scripts/generate-python-sources.sh from
  # packaging/sources/python-requirements.in.
  # This must contain ComfyUI deps, PyTorch, comfyui_manager, pip, wheel, uv.
  - packaging/pypi-dependencies.json

  # Runtime git for ComfyUI-Manager custom-node clone/update operations.
  - name: git
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/git/git.git
        commit: bb5c624209fcaebd60b9572b2cc8c61086e39b57
        tag: v2.51.2
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} prefix=/app NO_GETTEXT=YesPlease NO_TCLTK=YesPlease all
      - make prefix=/app NO_GETTEXT=YesPlease NO_TCLTK=YesPlease install

  - name: comfyui
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/Comfy-Org/ComfyUI.git
        commit: dec5d9450a5290bcf63430409ea41018e67f41c3
      - type: file
        path: packaging/comfyui-flatpak-launcher
      - type: file
        path: packaging/comfyui-flatpak-pip
      - type: file
        path: packaging/comfyui-flatpak-uv
      - type: file
        path: packaging/comfyui-flatpak-install-requirements
      - type: file
        path: packaging/comfyui-flatpak-cc
      - type: file
        path: packaging/io.github.AyAmbo.ComfyUIFlatpak.desktop
      - type: file
        path: packaging/io.github.AyAmbo.ComfyUIFlatpak.metainfo.xml
      - type: file
        path: packaging/io.github.AyAmbo.ComfyUIFlatpak.svg
    build-commands:
      - mkdir -p /app/share/comfyui
      - cp -a . /app/share/comfyui
      - install -Dm755 comfyui-flatpak-launcher /app/bin/comfyui-flatpak
      - install -Dm755 comfyui-flatpak-pip /app/bin/comfyui-pip
      - install -Dm755 comfyui-flatpak-uv /app/bin/comfyui-uv
      - install -Dm755 comfyui-flatpak-install-requirements /app/bin/comfyui-install-requirements
      - install -Dm755 comfyui-flatpak-cc /app/bin/comfyui-flatpak-cc
      # Triton's runtime driver bridge includes Python.h. The Platform runtime
      # omits development headers, so copy only Python's headers from the SDK.
      - mkdir -p /app/share/comfyui-flatpak/include/x86_64-linux-gnu
      - cp -a /usr/include/python3.13 /app/share/comfyui-flatpak/include/
      - cp -a /usr/include/x86_64-linux-gnu/python3.13 /app/share/comfyui-flatpak/include/x86_64-linux-gnu/
      - install -Dm644 io.github.AyAmbo.ComfyUIFlatpak.desktop /app/share/applications/io.github.AyAmbo.ComfyUIFlatpak.desktop
      - install -Dm644 io.github.AyAmbo.ComfyUIFlatpak.metainfo.xml /app/share/metainfo/io.github.AyAmbo.ComfyUIFlatpak.metainfo.xml
      - install -Dm644 io.github.AyAmbo.ComfyUIFlatpak.svg /app/share/icons/hicolor/scalable/apps/io.github.AyAmbo.ComfyUIFlatpak.svg
      - desktop-file-validate /app/share/applications/io.github.AyAmbo.ComfyUIFlatpak.desktop || true
      - appstreamcli validate --no-net /app/share/metainfo/io.github.AyAmbo.ComfyUIFlatpak.metainfo.xml || true
